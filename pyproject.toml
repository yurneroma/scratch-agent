[project]
name = "scratch-agent"
version = "0.1.0"
description = "A from-scratch coding agent for learning how agents work"
readme = "README.md"
authors = [
    { name = "mabin", email = "mabin@bigai.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.13.0",
    "python-dotenv==1.2.4",
]

[project.scripts]
scratch-agent = "scratch_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
